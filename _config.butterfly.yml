# ===========================================
# Butterfly 主题配置文件（干净版 v4）
# ===========================================

# --------------------------------------
# 导航栏设置
# --------------------------------------
nav:
  logo:
  display_title: true
  display_post_title: true
  fixed: false

menu:
  首页: / || fas fa-home
  文章||fas fa-book:
    归档: /archives/ || fas fa-archive
    标签: /tags/ || fas fa-tags
    分类: /categories/ || fas fa-folder-open
  登录: https://www.bing.com || fas fa-sign-in-alt

# --------------------------------------
# 代码块设置（关闭内置复制，用浏览器原生复制）
# --------------------------------------
code_blocks:
  theme: darker
  macStyle: false
  height_limit: false
  word_wrap: true
  copy: true
  language: true
  shrink: false
  fullpage: false

# --------------------------------------
# 社交链接
# --------------------------------------
social:

# --------------------------------------
# 图片设置
# --------------------------------------
favicon: /img/favicon.png

avatar:
  img: /img/avatar.png
  effect: false

disable_top_img: true
default_top_img: 
index_img: 
archive_img: 
tag_img: 
category_img: 

cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  default_cover:

error_img:
  flink: /img/friend_404.gif
  post_page: /img/404.jpg

error_404:
  enable: true
  subtitle: '页面不存在'
  background:

# --------------------------------------
# 文章页设置
# --------------------------------------
post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: false
    label: true
  post:
    position: left
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

# --------------------------------------
# 首页设置
# --------------------------------------
index_site_info_top:
index_top_img_height:

subtitle:
  enable: false
  effect: true
  typed_option:
  source: false
  sub:

index_layout: 3

index_post_content:
  method: 3
  length: 500

# --------------------------------------
# 文章目录
# --------------------------------------
toc:
  post: true
  page: false
  number: true
  expand: true
  style_simple: false
  scroll_percent: true

# --------------------------------------
# 版权信息
# --------------------------------------
post_copyright:
  enable: true
  decode: false
  author_href:
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# --------------------------------------
# 打赏
# --------------------------------------
reward:
  enable: false
  text:
  QR_code:

# --------------------------------------
# 相关文章
# --------------------------------------
related_post:
  enable: true
  limit: 6
  date_type: created

post_pagination: 1

# --------------------------------------
# 过期提醒
# --------------------------------------
noticeOutdate:
  enable: true
  style: flat
  limit_day: 365
  position: top
  message_prev: 本文最后更新于
  message_next: 天前，内容可能已过时。

# --------------------------------------
# 页脚设置
# --------------------------------------
footer:
  owner:
    enable: true
    since: 2025
  copyright:
    enable: false
    version: false
  custom_text:

# --------------------------------------
# 侧边栏设置
# --------------------------------------
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: 欢迎来到我的博客
    button:
      enable: false
      icon:
      text:
      link:
  card_announcement:
    enable: true
    content: 欢迎访问！
  card_recent_post:
    enable: true
    limit: 5
    sort: date
    sort_order:
  card_newest_comments:
    enable: false
    sort_order:
    limit: 6
    storage: 10
    avatar: true
  card_categories:
    enable: true
    limit: 8
    expand: none
    sort_order:
  card_tags:
    enable: true
    limit: 40
    color: true
    orderby: random
    order: 1
    sort_order:
  card_archives:
    enable: true
    type: monthly
    format: YYYY年MM月
    order: -1
    limit: 8
    sort_order:
  card_post_series:
    enable: true
    series_title: false
    orderBy: 'date'
    order: -1
  card_webinfo:
    enable: true
    post_count: false
    last_push_date: true
    sort_order:
    runtime_date:

# --------------------------------------
# 右下角按钮
# --------------------------------------
rightside_bottom:

translate:
  enable: false

readmode: true

darkmode:
  enable: true
  button: true
  autoChangeMode: false

rightside_scroll_percent: true

rightside_item_order:
  enable: false
  hide:
  show:

# --------------------------------------
# 全局设置
# --------------------------------------
anchor:
  auto_update: false
  click_to_scroll: true

photofigcaption: false

copy:
  enable: true
  copyright:
    enable: false
    limit_count: 150

wordcount:
  enable: true
  post_wordcount: false
  min2read: true
  total_wordcount: false

busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

# --------------------------------------
# 搜索设置
# --------------------------------------
search:
  use: local_search
  placeholder: 搜索文章

  algolia_search:
    hitsPerPage: 6

  local_search:
    preload: true
    top_n_per_article: 1
    unescape: false
    pagination:
      enable: false
      hitsPerPage: 8
    CDN:

# --------------------------------------
# 分享设置
# --------------------------------------
share:
  use:

# --------------------------------------
# 评论设置
# --------------------------------------
comments:
  use:
  text: true
  lazyload: false
  count: false
  card_post_count: false

twikoo:
  envId:
  region:
  visitor: true
  option:

# --------------------------------------
# 图片灯箱
# --------------------------------------
lightbox: fancybox

# --------------------------------------
# 文章系列
# --------------------------------------
series:
  enable: true
  orderBy: 'title'
  order: 1
  number: true

# --------------------------------------
# 美化设置
# --------------------------------------
theme_color:
  enable: true
  main: "#49B1F5"
  paginator: "#00c4b6"
  button_hover: "#FF7242"
  text_selection: "#00c4b6"
  link_color: "#99a9bf"
  meta_color: "#858585"
  hr_color: "#A4D8FA"
  code_foreground: "#F47466"
  code_background: "rgba(27, 31, 35, .05)"
  toc_color: "#00c4b6"
  blockquote_padding_color: "#49b1f5"
  blockquote_background_color: "#49b1f5"
  scrollbar_color: "#49b1f5"
  meta_theme_color_light: "ffffff"
  meta_theme_color_dark: "#0d0d0d"

category_ui:
tag_ui:

rounded_corners_ui: true
text_align_justify: false

mask:
  header: true
  footer: true

preloader:
  enable: true
  source: 1
  pace_css_url:

enter_transitions: true

display_mode: light

beautify:
  enable: false
  field: post
  title_prefix_icon:
  title_prefix_icon_color:

font:
  global_font_size:
  code_font_size:
  font_family:
  code_font_family:

hr_icon:
  enable: true
  icon:
  icon_top:

# --------------------------------------
# 图片懒加载
# --------------------------------------
lazyload:
  enable: true
  native: false
  field: site
  placeholder:
  blur: true

# --------------------------------------
# PJAX
# --------------------------------------
pjax:
  enable: true
  exclude:

# --------------------------------------
# Instant Page
# --------------------------------------
instantpage: true

# --------------------------------------
# PWA
# --------------------------------------
pwa:
  enable: false

# --------------------------------------
# Open Graph
# --------------------------------------
Open_Graph_meta:
  enable: true
  option:

# --------------------------------------
# CDN 设置
# --------------------------------------
CDN:
  internal_provider: local
  third_party_provider: jsdelivr
  version: true
  custom_format:
  option:

