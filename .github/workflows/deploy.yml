name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [custom]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

# 让 GitHub Pages 有权限部署
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一条部署,避免冲突
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build Hexo site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: custom
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with Hexo
        run: |
          npx hexo clean
          npx hexo generate

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
