name: Sync from S3 and Deploy

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: custom

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << CONF
          [s3]
          type = s3
          provider = Other
          access_key_id = ${{ secrets.S3_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.S3_SECRET_ACCESS_KEY }}
          endpoint = ${{ secrets.S3_ENDPOINT }}
          CONF

      - name: Sync posts from S3
        run: rclone sync s3:${{ secrets.S3_BUCKET }}/blog/posts/ source/_posts/ --verbose

      - name: Check for changes
        id: changes
        run: |
          if [[ -n $(git status -s source/_posts/) ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add source/_posts/
          git commit -m "docs: 同步文章 $(date '+%Y-%m-%d %H:%M')"
          git push origin custom
